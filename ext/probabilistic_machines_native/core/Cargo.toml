[package]
name = "probabilistic-machines"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license = "MIT"
description = "Sketches for distinct counts, quantiles and frequencies - no_std, zero dependencies"
repository = "https://github.com/seuros/probabilistic_machines"
keywords = ["hyperloglog", "t-digest", "count-min", "sketch", "no-std"]
categories = ["no-std", "algorithms", "data-structures"]
readme = "README.md"
exclude = ["src/**/tests.rs"]

[lib]
name = "probabilistic_machines"
crate-type = ["lib"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[lints]
workspace = true
