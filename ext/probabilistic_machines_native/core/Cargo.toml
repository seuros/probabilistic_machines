[package]
name = "probabilistic-machines"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license = "MIT"
description = "Sketches for distinct counts, quantiles and frequencies - no_std, fixed-size except the t-digest"
repository = "https://github.com/seuros/probabilistic_machines"
keywords = ["hyperloglog", "t-digest", "count-min", "sketch", "no-std"]
categories = ["no-std", "algorithms", "data-structures"]
readme = "README.md"
exclude = ["src/**/tests.rs", "tests/"]
[lib]
name = "probabilistic_machines"
crate-type = ["lib"]

[features]
default = ["alloc"]
alloc = []

[dependencies]
sliderule-machines = ">=0.2"

[lints]
workspace = true
