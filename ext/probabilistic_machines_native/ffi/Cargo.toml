[package]
name = "probabilistic_machines_native"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license = "MIT"
description = "Ruby bindings for the probabilistic-machines sketches"
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
probabilistic-machines = { workspace = true, features = ["std"] }
magnus = { version = ">= 0.9.3", default-features = false, features = ["bytes", "io"] }
# Nothing here calls rb-sys directly: this is the compiled fallback that
# implements the stable API for a Ruby rb-sys has no pre-generated bindings
# for, such as a preview. magnus asks for "stable-api" without it, and
# default-features = false drops the default that would have supplied it, so
# removing this line breaks the build on every future Ruby.
# Nothing here calls rb-sys directly: this is the compiled fallback that
# implements the stable API for a Ruby rb-sys ships no pre-generated bindings
# for, such as a preview. magnus asks for "stable-api" without it, and its
# default-features = false drops the default that would have supplied it, so
# dropping this line breaks the build on every Ruby newer than rb-sys.
rb-sys = { version = ">= 0.9.130", default-features = false, features = ["stable-api-compiled-fallback"] }

bytes = "1"
